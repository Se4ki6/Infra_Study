<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>じゃんけん 10番勝負</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 40px auto; padding: 20px; color: #222; }
    h1 { text-align: center; }
    .section { margin: 24px 0; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
    #auth-status { font-weight: bold; margin-bottom: 10px; }
    .error { color: #c0392b; }
    .hand-buttons { display: flex; gap: 12px; justify-content: center; margin: 16px 0; }
    .hand-buttons button {
      font-size: 40px; width: 88px; height: 88px; cursor: pointer;
      border: 2px solid #ccc; border-radius: 12px; background: #fafafa;
    }
    .hand-buttons button:hover:not(:disabled) { border-color: #4a90d9; background: #eef6ff; }
    .hand-buttons button:disabled { opacity: 0.4; cursor: not-allowed; }
    #progress { text-align: center; font-size: 18px; margin: 8px 0; }
    #round-result { text-align: center; font-size: 22px; min-height: 32px; margin: 10px 0; }
    #final-result { text-align: center; font-size: 20px; font-weight: bold; margin: 12px 0; }
    .center { text-align: center; }
    button.primary { padding: 10px 24px; font-size: 16px; cursor: pointer; border-radius: 8px;
      border: none; background: #4a90d9; color: #fff; }
    button.primary:hover { background: #3a7bc0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 12px; border-bottom: 1px solid #eee; text-align: left; }
    th { background: #f5f5f5; }
    td.num { text-align: right; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>✊✌✋ じゃんけん 10番勝負</h1>

  <div class="section">
    <h2>ログイン</h2>
    <div id="auth-status">未ログイン</div>
    <div id="auth-container"></div>
  </div>

  <div class="section" id="game-section">
    <h2>ゲーム</h2>
    <div id="game-locked" class="center">ログインするとプレイできます。</div>

    <div id="game-area" class="hidden">
      <div id="progress"></div>
      <div class="hand-buttons">
        <button data-hand="rock"     onclick="play('rock')">✊</button>
        <button data-hand="scissors" onclick="play('scissors')">✌️</button>
        <button data-hand="paper"    onclick="play('paper')">✋</button>
      </div>
      <div id="round-result"></div>
      <div id="final-result"></div>
      <div class="center">
        <button class="primary" id="start-button" onclick="startGame()">ゲーム開始</button>
      </div>
      <div id="game-error" class="center error"></div>
    </div>
  </div>

  <div class="section">
    <h2>🏆 ランキング（勝利数）</h2>
    <div id="ranking"></div>
  </div>

  <script type="module" src="/src/index.ts"></script>
</body>
</html>
