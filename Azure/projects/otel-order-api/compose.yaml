services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    # 新しい Azure Storage SDK の API バージョンでもローカル検証できるようにします。
    command: azurite --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

  aspire-dashboard:
    image: mcr.microsoft.com/aspire/dashboard:latest
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:4317:18889"

volumes:
  azurite-data:
